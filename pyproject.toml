[project]
name = "signalalpha"
version = "0.1.0"
description = "Research terminal surfacing fundamental inflections in Indian small and micro caps from public data only."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pgserver>=0.1.4",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "database", "data", "pipelines", "signals", "agents", "scoring", "backtesting", "evidence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps", "database", "data", "pipelines", "signals", "agents", "scoring", "backtesting", "evidence", "tests"]
exclude = ["database/migrations/versions"]

[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*", "celery", "celery.*", "kombu", "kombu.*", "pgvector.*", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pipelines.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:database", "error::DeprecationWarning:signals"]

[tool.coverage.run]
source = ["scoring", "signals", "evidence", "backtesting", "database"]

[tool.ruff.lint.per-file-ignores]
# Mock document text and the row-mapping generator are dominated by long literal strings.
"data/mock/templates.py" = ["E501"]
"data/mock/generator.py" = ["E501"]
# Agent modules carry long template prose and mechanism descriptions.
"agents/*.py" = ["E501"]
# Live ingestion modules carry long URL templates and wide row literals.
"data/live.py" = ["E501"]
"data/fetchers/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
# Narration renders one sentence per signal type; the tables read better unwrapped.
"decisions/narrate.py" = ["E501"]
# Readiness checks read better as one line per check.
"decisions/readiness.py" = ["E501"]
"apps/api/routers/desk.py" = ["E501"]
